<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Skill Gap Analyzer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 8%;
        }

        header h1 {
            font-size: 27px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h2 {
            font-size: 42px;
            color: #172554;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
            max-width: 650px;
            margin: auto;
            line-height: 1.7;
        }

        .hero button {
            margin-top: 30px;
            padding: 15px 35px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        .hero button:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }
    </style>

</head>

<body>

    <header>
        <h1>AI Skill Gap Analyzer</h1>
    </header>

    <section class="hero">

        <h2>Discover Your Skills. Build Your Future.</h2>

        <p>
            Identify your existing skills, discover the skills
            required for your dream career, and receive personalized
            learning recommendations to prepare yourself for the industry.
        </p>

        <button onclick="alert('Career assessment coming soon!')">
            Get Started
        </button>

    </section>

    <footer>
        © 2026 AI Skill Gap Analyzer | All Rights Reserved
    </footer>

</body>

</html>
